name: ai-chat-notebook

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    init: true
    shm_size: '1gb'
    # Run as the host user so bind-mounted writes (out/, package-lock.json)
    # come out owned by whoever is driving this, not root. Defaults to 1000
    # only as a fallback; see README for exporting these. Compose reads them
    # from the environment or a .env file — note that bash's own $UID is a
    # shell variable and is NOT exported, so it will not arrive here by itself.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # Persisting npm's cache and Electron's downloaded binary across
      # disposable containers — the containers are throwaway, the ~100MB
      # download need not be.
      - cache:/cache
    environment:
      - DISPLAY=${DISPLAY:-}
      - NOTEBOOK_DISABLE_GPU=1
      - ELECTRON_DISABLE_SANDBOX=1
    tty: true

  # Same image and caches as `dev`, but sharing the host's network namespace.
  # Needed only for talking to a debugging port that lives on the host's
  # loopback — a normal container gets its own namespace, so 127.0.0.1 there is
  # the container, not the host, and a reverse-forwarded CDP port is invisible
  # to it. Host networking is deliberately confined to this one service rather
  # than applied to `dev`, since it also removes the isolation that makes the
  # default safe to run anything in.
  recon:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    init: true
    network_mode: host
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - cache:/cache

volumes:
  node_modules:
  cache:
